apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-credentials
  namespace: team-a
stringData:
  apiToken: <apiToken>
---
apiVersion: core.cloudflare.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://api.cloudflare.com/client/v4
  secretRef:
    name: cloudflare-credentials
