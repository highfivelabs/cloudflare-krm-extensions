# The delete puts back Cloudflare's default; the kind's before and after
# calls put back what was there.
- kind: TieredCache
  replaceSample: true
  before:
  - {method: GET, path: "/zones/{{cred:zoneId}}/cache/tiered_cache_smart_topology_enable", save: {smartTopology: result/value}}
  after:
  - {method: PATCH, path: "/zones/{{cred:zoneId}}/cache/tiered_cache_smart_topology_enable", body: {value: "{{var:smartTopology}}"}}
  spec: {zoneID: "{{cred:zoneId}}", value: "on"}
  change: {value: "off"}
  drift: "on"
  stays: a zone setting; the delete turns Smart Tiered Cache off and it still reads

- kind: UrlNormalizationSettings
  replaceSample: true
  before:
  - {method: GET, path: "/zones/{{cred:zoneId}}/url_normalization", save: {urlType: result/type, urlScope: result/scope}}
  after:
  - {method: PUT, path: "/zones/{{cred:zoneId}}/url_normalization", body: {type: "{{var:urlType}}", scope: "{{var:urlScope}}"}}
  spec: {zoneID: "{{cred:zoneId}}", type: cloudflare, scope: incoming}
  change: {type: rfc3986}
  drift: cloudflare
  driftFull: true                 # PUT wants type and scope
  stays: a zone setting; the delete puts back the default and it still reads

# Not run: each says why. "plan:" needs a paid plan or an entitlement the free
# account lacks (the API's own answer is quoted); "off limits:" would touch
# what a run must never touch; "api:" the API or descriptor cannot be driven
# as described; "token:" the token lacks a permission; "not yet tried:" what
# is uncertain until a live run tries it.
- kind: CloudConnectorRules
  replaceSample: true
  spec:
    zoneID: "{{cred:zoneId}}"
    rules:
    - description: "{{name}}"
      enabled: false
      expression: 'http.host eq "example.com"'
      parameters: {host: examplebucket.s3.eu-north-1.amazonaws.com}
      provider: aws_s3
  change:
    rules:
    - description: "{{name}}-2"
      enabled: false
      expression: 'http.host eq "example.com"'
      parameters: {host: examplebucket.s3.eu-north-1.amazonaws.com}
      provider: aws_s3
  drift:
  - description: hfl-live-drift
    enabled: false
    expression: 'http.host eq "example.com"'
    parameters: {host: examplebucket.s3.eu-north-1.amazonaws.com}
    provider: aws_s3

- kind: WorkersScript
  replaceSample: true
  spec:
    accountID: "{{cred:accountId}}"
    scriptName: "{{name}}"
    metadata:
      main_module: index.js
      compatibility_date: "2026-01-01"
    files:
    - name: index.js
      contentType: application/javascript+module
      content: 'export default { async fetch() { return new Response("hfl-live"); } };'
  change:
    files:
    - name: index.js
      contentType: application/javascript+module
      content: 'export default { async fetch() { return new Response("hfl-live-2"); } };'
  noDrift: GET /workers/scripts/{script_name} returns the raw script bundle rather than JSON

# The cron schedules of the run's own Worker (made in before:).
- kind: WorkersCronTrigger
  replaceSample: true
  spec: {accountID: "{{cred:accountId}}", scriptName: "{{run}}", schedules: [{cron: "0 3 * * *"}]}
  change: {schedules: [{cron: "0 4 * * *"}]}
  drift: [{cron: "0 5 * * *"}]

