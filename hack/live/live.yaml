#
# Live tests (TestEveryKindLive, krm-rest-runtime's kindtest.Live): these
# kinds, in this order, against the real API. Kinds not listed are not run
# live. They skip, naming the secret, until it exists in Secret Manager; then
#   KRM_LIVE=1 go test -tags live -run TestEveryKindLive -v .
# Everything a run makes is named hfl-live-<stamp>-<hex> (or hfl_live_...),
# deleted at the end; the sweep deletes older leftovers. How it works and
# what the {{...}} templates mean: krm-rest-runtime docs/live.md.
#
# The account is a free one with one zone on the Free Website plan. The
# token is an account-owned API token. A run never touches the zone itself,
# its plan, its existing DNS records, account members, account-wide settings
# or any token, and never buys anything: kinds that need a paid plan, an
# entitlement or a payment method are listed with skip: and why. Zone
# settings kinds change one setting and put the old value back.
secret: krm-live-cloudflare     # JSON: {"apiToken": "...", "accountId": "...", "zoneId": "..."}
target: Cloudflare free account (Free Website zone)
# The account's workers.dev subdomain (a Worker's URL is
# https://<script>.<account>.workers.dev) names the account: redacted
# wherever a run records it (krm-rest-runtime docs/live.md, "Identities").
redactSubdomains: [workers.dev]

# One Worker, deployed (a module with a fetch handler and Workflow classes),
# for the Workflow kind.
before:
- {method: POST, path: "/accounts/{{cred:accountId}}/workers/workers", body: {name: "{{run}}"}, save: {worker: result/id}}
- method: POST
  path: "/accounts/{{cred:accountId}}/workers/workers/{{var:worker}}/versions"
  body: {compatibility_date: "2026-01-01", main_module: index.js, modules: [{name: index.js, content_type: application/javascript+module, content_base64: ""}]}
  save: {version: result/id}
- {method: POST, path: "/accounts/{{cred:accountId}}/workers/scripts/{{run}}/deployments", body: {strategy: percentage, versions: [{percentage: 100, version_id: "{{var:version}}"}]}}
after:
- {method: DELETE, path: "/accounts/{{cred:accountId}}/workers/scripts/{{run}}?force=true", ok: [404]}

sweep:
- {list: "/accounts/{{cred:accountId}}/firewall/access_rules/rules?per_page=100", items: result, name: notes, id: id, delete: "/accounts/{{cred:accountId}}/firewall/access_rules/rules/{id}"}
- {list: "/accounts/{{cred:accountId}}/ai-gateway/gateways?per_page=50", items: result, name: id, delete: "/accounts/{{cred:accountId}}/ai-gateway/gateways/{id}"}
- {list: "/accounts/{{cred:accountId}}/d1/database?per_page=100", items: result, name: name, id: uuid, delete: "/accounts/{{cred:accountId}}/d1/database/{id}"}
- {list: "/accounts/{{cred:accountId}}/rules/lists", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/rules/lists/{id}"}
- {list: "/accounts/{{cred:accountId}}/storage/kv/namespaces?per_page=100", items: result, name: title, id: id, delete: "/accounts/{{cred:accountId}}/storage/kv/namespaces/{id}"}
- {list: "/accounts/{{cred:accountId}}/queues?per_page=100", items: result, name: queue_name, id: queue_id, delete: "/accounts/{{cred:accountId}}/queues/{id}"}
- {list: "/accounts/{{cred:accountId}}/secrets_store/stores", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/secrets_store/stores/{id}"}
- {list: "/accounts/{{cred:accountId}}/iam/user_groups", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/iam/user_groups/{id}"}
- {list: "/accounts/{{cred:accountId}}/mtls_certificates", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/mtls_certificates/{id}"}
- {list: "/accounts/{{cred:accountId}}/flagship/apps", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/flagship/apps/{id}"}
- {list: "/accounts/{{cred:accountId}}/moq/relays", items: result, name: name, id: uid, delete: "/accounts/{{cred:accountId}}/moq/relays/{id}"}
- {list: "/accounts/{{cred:accountId}}/oauth_clients", items: result, name: client_name, id: client_id, delete: "/accounts/{{cred:accountId}}/oauth_clients/{id}"}
- {list: "/accounts/{{cred:accountId}}/email/routing/addresses", items: result, name: email, id: id, delete: "/accounts/{{cred:accountId}}/email/routing/addresses/{id}"}
- {list: "/zones/{{cred:zoneId}}/workers/routes", items: result, name: pattern, id: id, delete: "/zones/{{cred:zoneId}}/workers/routes/{id}"}
- {list: "/accounts/{{cred:accountId}}/workers/scripts", items: result, name: id, delete: "/accounts/{{cred:accountId}}/workers/scripts/{id}"}
- {list: "/accounts/{{cred:accountId}}/workers/workers?per_page=100", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/workers/workers/{id}"}
- {list: "/zones/{{cred:zoneId}}/email/routing/rules", items: result, name: name, id: id, delete: "/zones/{{cred:zoneId}}/email/routing/rules/{id}"}
- {list: "/zones/{{cred:zoneId}}/firewall/lockdowns", items: result, name: description, id: id, delete: "/zones/{{cred:zoneId}}/firewall/lockdowns/{id}"}
- {list: "/zones/{{cred:zoneId}}/page_shield/policies", items: result, name: description, id: id, delete: "/zones/{{cred:zoneId}}/page_shield/policies/{id}"}
- {list: "/zones/{{cred:zoneId}}/web3/hostnames", items: result, name: name, id: id, delete: "/zones/{{cred:zoneId}}/web3/hostnames/{id}"}
- {list: "/zones/{{cred:zoneId}}/schema_validation/schemas", items: result, name: name, id: schema_id, delete: "/zones/{{cred:zoneId}}/schema_validation/schemas/{id}"}
- {list: "/zones/{{cred:zoneId}}/snippets", items: result, name: snippet_name, delete: "/zones/{{cred:zoneId}}/snippets/{id}"}
- {list: "/zones/{{cred:zoneId}}/healthchecks", items: result, name: name, id: id, delete: "/zones/{{cred:zoneId}}/healthchecks/{id}"}
- {list: "/zones/{{cred:zoneId}}/waiting_rooms", items: result, name: name, id: id, delete: "/zones/{{cred:zoneId}}/waiting_rooms/{id}"}
- {list: "/accounts/{{cred:accountId}}/ai-search/namespaces", items: result, name: name, delete: "/accounts/{{cred:accountId}}/ai-search/namespaces/{id}"}
- {list: "/zones/{{cred:zoneId}}/custom_pages/assets", items: result, name: name, delete: "/zones/{{cred:zoneId}}/custom_pages/assets/{id}"}
- {list: "/accounts/{{cred:accountId}}/challenges/widgets", items: result, name: name, id: sitekey, delete: "/accounts/{{cred:accountId}}/challenges/widgets/{id}"}
- {list: "/accounts/{{cred:accountId}}/alerting/v3/policies", items: result, name: name, id: id, delete: "/accounts/{{cred:accountId}}/alerting/v3/policies/{id}"}
- {list: "/accounts/{{cred:accountId}}/calls/apps", items: result, name: name, id: uid, delete: "/accounts/{{cred:accountId}}/calls/apps/{id}"}
- {list: "/accounts/{{cred:accountId}}/rum/site_info/list?per_page=100", items: result, name: ruleset/zone_name, id: site_tag, delete: "/accounts/{{cred:accountId}}/rum/site_info/{id}"}
- {list: "/zones/{{cred:zoneId}}/firewall/ua_rules?per_page=100", items: result, name: description, id: id, delete: "/zones/{{cred:zoneId}}/firewall/ua_rules/{id}"}
- {list: "/certificates?zone_id={{cred:zoneId}}", items: result, name: hostnames/0, id: id, delete: "/certificates/{id}"}
- {list: "/accounts/{{cred:accountId}}/workflows", items: result, name: name, delete: "/accounts/{{cred:accountId}}/workflows/{id}"}
- {list: "/accounts/{{cred:accountId}}/workers/domains", items: result, name: hostname, id: id, delete: "/accounts/{{cred:accountId}}/workers/domains/{id}"}


