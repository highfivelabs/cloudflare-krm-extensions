- kind: EmailRoutingRule
  replaceSample: true
  spec: {zoneID: "{{cred:zoneId}}", name: "{{name}}", enabled: false, matchers: [{type: literal, field: to, value: "{{name}}@{{cred:zoneName}}"}], actions: [{type: drop}]}
  change: {name: "{{name}}-2"}
  drift: "{{name}}-3"
  driftFull: true                 # PUT replaces the rule

- kind: OriginCloudRegion
  replaceSample: true
  spec: {zoneID: "{{cred:zoneId}}", origin_ip: 192.0.2.10, vendor: aws, region: us-east-1}
  change: {region: us-west-2}
  drift: eu-west-1
  driftFull: true                 # the PUT wants origin_ip in the body

- kind: SchemaValidationSchemas
  replaceSample: true
  spec: {zoneID: "{{cred:zoneId}}", name: "{{name}}", kind: openapi_v3, validation_enabled: false, source: '{"openapi":"3.0.0","info":{"title":"hfl-live","version":"1"},"servers":[{"url":"https://hfl-live.{{cred:zoneName}}"}],"paths":{"/ping":{"get":{"responses":{"200":{"description":"ok"}}}}}}'}
  change: {validation_enabled: true}
  noDrift: the API refuses to turn a schema's validation off again (20400 "delete schema instead")

