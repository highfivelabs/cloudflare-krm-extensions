# Upjet references that gen/examples.py (krm-rest-runtime) would turn into
# examples/<Kind>/with-<Target>.yaml, but that don't hold here, with why.
upjet:
  QueueConsumer: >-
    its references now meet (the Queue takes the same Account as the
    consumer), but the consumer's example is a worker consumer with no
    script_name, which Cloudflare requires for type worker (the spec's
    mq_worker-consumer-request). The fake takes it.
